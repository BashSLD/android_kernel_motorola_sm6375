name: Build fogos kernel (ReSukiSU proven, no susfs)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          ref: resukisu-green
          submodules: recursive
          fetch-depth: 1
          path: kernel

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make gcc git zip unzip \
            libncurses-dev python3 python-is-python3 cpio device-tree-compiler ccache rsync

      - name: Submodule sanity (ReSukiSU pinned)
        working-directory: kernel
        run: |
          git submodule update --init --recursive || true
          echo "--- KernelSU dir ---"; ls -la KernelSU 2>/dev/null | head || echo "KernelSU MISSING"
          if [ -f KernelSU/kernel/Makefile ]; then echo "KSU OK"; else echo "KSU MISSING -> clon manual"; \
            rm -rf KernelSU; git clone https://github.com/ReSukiSU/ReSukiSU.git KernelSU; \
            git -C KernelSU checkout 1ccbf7b6414680ad269049eb5e103afdc7ccc00a; fi

      - name: Build (proven build.sh, wakacaw_defconfig)
        working-directory: kernel
        run: |
          chmod +x build.sh || true
          bash build.sh -c

      - name: Locate artifact
        working-directory: kernel
        run: |
          echo "--- zips ---"; ls -la *.zip 2>/dev/null || echo "no zip en raiz"
          echo "--- Image ---"; ls -la out/arch/arm64/boot/Image 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fogos-resukisu-anykernel3
          path: kernel/*.zip
          if-no-files-found: warn
